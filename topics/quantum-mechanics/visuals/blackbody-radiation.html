<style>
:root{--bg:#f5f7fa;--panel:#fff;--fg:#161a20;--muted:#5a6472;--accent:#e0562d;--accent2:#8b8f98;--line:#d7dce3;--grid:#e8ecf1}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--panel:#171c23;--fg:#e7ebf1;--muted:#9aa4b2;--accent:#ff7a4d;--accent2:#6b7280;--line:#2a313b;--grid:#1e252e}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:hidden}
.wrap{display:flex;flex-direction:column;height:100%;padding:12px;gap:8px}
h1{font-size:15px;font-weight:600}
.cap{font-size:12.5px;color:var(--muted)}
.plot{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;position:relative}
canvas{width:100%;height:100%;display:block}
.ctrl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
label{font-size:12.5px;color:var(--muted);min-width:88px}
input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.val{font-variant-numeric:tabular-nums;font-weight:600;min-width:78px;text-align:right}
.legend{display:flex;gap:14px;font-size:12px;flex-wrap:wrap;margin-top:2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.tag{font-size:12px;color:var(--muted)}
.swatch{width:44px;height:16px;border-radius:4px;border:1px solid var(--line);display:inline-block;vertical-align:middle}
</style>
<div class="wrap">
  <div><h1>Blackbody Radiation &amp; the UV Catastrophe</h1>
  <div class="cap">Drag the temperature up: Planck's curve peaks and slides toward shorter (bluer) wavelengths. The classical curve just explodes into the ultraviolet — the catastrophe.</div></div>
  <div class="plot"><canvas id="c"></canvas></div>
  <div class="ctrl">
    <div class="row">
      <label for="t">Temperature</label>
      <input id="t" type="range" min="3000" max="9000" step="50" value="5000">
      <span class="val" id="tv">5000 K</span>
    </div>
    <div class="row" style="margin-top:6px">
      <span class="tag">Glow color at this temperature:</span> <span class="swatch" id="sw"></span>
      <span class="tag" id="peak"></span>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:var(--accent)"></span>Planck's law (reality)</span>
      <span><span class="dot" style="background:var(--accent2)"></span>Classical (Rayleigh–Jeans)</span>
    </div>
  </div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const T=document.getElementById('t'),TV=document.getElementById('tv'),SW=document.getElementById('sw'),PK=document.getElementById('peak');
const LMIN=100,LMAX=2400; // nm
const HCK=1.438776e7; // hc/k in nm*K
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function planck(l,t){const x=HCK/(l*t);return 1/(Math.pow(l,5)*(Math.expm1(x)))}
function rj(l,t){return t/Math.pow(l,4)} // Rayleigh-Jeans
// color of blackbody (approx) from temperature
function bbColor(t){
  // approximate: use Wien peak wavelength mapped to visible RGB with warmth
  let r,g,b;const t2=t/100;
  if(t2<=66){r=255;g=99.47*Math.log(t2)-161.1;}else{r=329.7*Math.pow(t2-60,-0.1332);g=288*Math.pow(t2-60,-0.0755);}
  if(t2>=66)b=255;else if(t2<=19)b=0;else b=138.5*Math.log(t2-10)-305.0;
  const cl=v=>Math.max(0,Math.min(255,v))|0;return `rgb(${cl(r)},${cl(g)},${cl(b)})`;
}
function fit(){const r=cv.parentNode.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);return{w:r.width,h:r.height}}
function draw(){
  const {w,h}=fit();const t=+T.value;
  ctx.clearRect(0,0,w,h);
  const pad={l:38,r:12,t:14,b:26};const pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;
  // find global max planck across our temp range for stable scaling
  let pmax=0;for(let l=LMIN;l<=LMAX;l+=4){const v=planck(l,9000);if(v>pmax)pmax=v;}
  const yScale=ph/(pmax*1.02);
  const X=l=>pad.l+(l-LMIN)/(LMAX-LMIN)*pw;
  const Y=v=>pad.t+ph-Math.min(v*yScale,ph);
  // grid
  ctx.strokeStyle=css('--grid');ctx.lineWidth=1;ctx.fillStyle=css('--muted');ctx.font='11px system-ui';
  ctx.textAlign='center';
  for(let l=500;l<=LMAX;l+=500){const x=X(l);ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,pad.t+ph);ctx.stroke();ctx.fillText(l+'nm',x,h-9);}
  ctx.textAlign='right';ctx.fillText('intensity',pad.l-4,pad.t+8);
  // visible spectrum band 380-700nm
  const grd=ctx.createLinearGradient(X(380),0,X(700),0);
  grd.addColorStop(0,'rgba(120,60,200,.16)');grd.addColorStop(.3,'rgba(60,120,255,.14)');grd.addColorStop(.55,'rgba(60,200,90,.14)');grd.addColorStop(.8,'rgba(240,210,40,.16)');grd.addColorStop(1,'rgba(230,60,50,.16)');
  ctx.fillStyle=grd;ctx.fillRect(X(380),pad.t,X(700)-X(380),ph);
  // Rayleigh-Jeans (scaled to same units at large lambda) - normalize so it matches planck tail
  ctx.strokeStyle=css('--accent2');ctx.lineWidth=2;ctx.setLineDash([5,4]);ctx.beginPath();let started=false;
  // match RJ to planck by constant so curves agree at long wavelength
  const lref=LMAX; const k=planck(lref,t)/rj(lref,t);
  for(let l=LMIN;l<=LMAX;l+=3){const y=Y(rj(l,t)*k);const x=X(l);if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);}
  ctx.stroke();ctx.setLineDash([]);
  // Planck
  ctx.strokeStyle=css('--accent');ctx.lineWidth=2.6;ctx.beginPath();started=false;let peakL=0,peakV=0;
  for(let l=LMIN;l<=LMAX;l+=2){const v=planck(l,t);if(v>peakV){peakV=v;peakL=l;}const x=X(l),y=Y(v);if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);}
  ctx.stroke();
  // fill under planck
  ctx.lineTo(X(LMAX),pad.t+ph);ctx.lineTo(X(LMIN),pad.t+ph);ctx.closePath();
  ctx.fillStyle=css('--accent')+'22';ctx.globalAlpha=.18;ctx.fill();ctx.globalAlpha=1;
  // peak marker
  const px=X(peakL),py=Y(peakV);ctx.fillStyle=css('--accent');ctx.beginPath();ctx.arc(px,py,4,0,7);ctx.fill();
  PK.textContent='peak ≈ '+Math.round(peakL)+' nm';
}
function upd(){TV.textContent=(+T.value)+' K';SW.style.background=bbColor(+T.value);draw();}
T.addEventListener('input',upd);
addEventListener('resize',draw);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)draw();});
upd();
</script>
